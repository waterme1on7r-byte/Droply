# Publish the marketing website AND standalone public browser app. The private preview remains password protected.
name: Deploy Droply website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'web/**'
      - 'index.html'
      - 'settings.js'
      - 'settings.css'
      - 'config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'droply-pages'
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy website to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out site
        uses: actions/checkout@v4
      - name: Prepare Node.js for the public browser build
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test Droply Web (public gateway only)
        env:
          DROPLY_PUBLIC_GATEWAY_URL: wss://droply-internal-preview.onrender.com
        run: |
          npm run web:build
          node --test web/test/*.test.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
