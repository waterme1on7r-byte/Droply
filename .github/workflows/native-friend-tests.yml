name: Native friend-request checks

on:
  pull_request:
    paths:
      - 'access.js'
      - 'main.js'
      - 'index.html'
      - 'android/**'
      - 'test/**'
      - '.github/workflows/native-friend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop signaling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

  android:
    name: Android compile and debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android 36 SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Assemble Android debug APK
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Droply-Android-Friend-Delivery-Debug
          if-no-files-found: error
          path: android/app/build/outputs/apk/debug/*.apk
