name: Droply build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./package.json').version) process.exit(1)"
      - name: Configure application
        shell: bash
        env:
          DROPLY_SERVER_URL: ${{ secrets.DROPLY_SERVER_URL }}
          DROPLY_ICE_JSON: ${{ secrets.DROPLY_ICE_JSON }}
        run: |
          if [ ! -f config.js ]; then node scripts/make-config.js; fi
          npm run check-config
      - name: Package installers and update metadata
        shell: bash
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          # An empty CSC_LINK is interpreted as a certificate file path.
          if [ -z "${CSC_LINK:-}" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${APPLE_ID:-}" ]; then unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; fi
          npx electron-builder --publish never
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Droply-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate and prepare Android release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.DROPLY_ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.DROPLY_ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.DROPLY_ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.DROPLY_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_STORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/droply-release.jks"
          echo "DROPLY_ANDROID_KEYSTORE=$RUNNER_TEMP/droply-release.jks" >> "$GITHUB_ENV"
          echo "DROPLY_ANDROID_STORE_PASSWORD=$ANDROID_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DROPLY_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "DROPLY_ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          unset ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD
      - name: Build side-by-side Android release APK
        working-directory: android
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          bash ./gradlew :app:assembleRelease -PdroplyNewInstall=true -PdroplyVersion="$version" --no-daemon
      - name: Verify and stage Android APK
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          badging=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk")
          grep -F "package: name='com.droply.android.release'" <<< "$badging"
          grep -F "versionName='$version'" <<< "$badging"
          mkdir -p release-assets
          cp "$apk" "release-assets/Droply-Android-$version.apk"
          cd release-assets
          sha256sum "Droply-Android-$version.apk" > SHA256SUMS-Android.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Droply-Android
          if-no-files-found: error
          path: release-assets/*
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Droply-*
          merge-multiple: true
          path: release-assets
      - name: Create draft release with all platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          # Match the safe asset names generated in electron-builder metadata.
          for asset in release-assets/*; do
            safe=$(basename "$asset" | tr ' ' '-')
            if [ "$asset" != "release-assets/$safe" ]; then mv "$asset" "release-assets/$safe"; fi
          done
          test -f release-assets/latest.yml
          test -f release-assets/latest-mac.yml
          test -n "$(find release-assets -maxdepth 1 -name 'Droply-Android-*.apk' -print -quit)"
          cat > release-notes.md <<'NOTES'
          ## What's included

          - Windows installer and in-app update metadata
          - Universal macOS installer and in-app update metadata (macOS 12 or later)
          - Android release APK for Android 10 and later

          The Android APK appears as **Droply (New)**, installs alongside the older Android app, and has a separate device identity. Keep both apps installed until you have added your friends to the new installation. This preserves the existing app and its device data.

          Web app and UI updates are available at https://waterme1on7r-byte.github.io/Droply/app/ .
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --draft --title "DROPLY $GITHUB_REF_NAME" --notes-file release-notes.md
          fi
