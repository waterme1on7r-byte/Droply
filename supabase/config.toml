# Isolated newsletter backend configuration.
# This file does not configure or change the Droply desktop app or its signaling server.
project_id = "droply-newsletter"

[functions.newsletter-subscribe]
# The landing-page visitors are anonymous. Authentication and validation are handled
# inside the function; never expose a service-role/secret key in the website.
verify_jwt = false

[functions.contact-send]
# Anonymous messages are validated and rate-limited by the server-side
# Edge Function. Public users do not have table privileges.
verify_jwt = false

[functions.contact-admin]
# Custom server-verified admin login/session; only authorized admins can read inbox data.
verify_jwt = false

[functions.droply-chat]
# Public website chat + visitor-confirmed ticket creation. Requests are validated
# and rate-limited inside the Edge Function. Service keys stay on the server.
verify_jwt = false
