<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Droply</title>
<style>
:root{--bg:#0f1115;--panel:#161a21;--card:#1d222b;--line:#262c37;--text:#e8eaee;--mute:#8b93a1;--accent:#6c8cff;--ok:#4ade80;--err:#f87171}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;overflow:hidden}
aside{width:280px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
.me{display:flex;align-items:center;gap:12px;padding:16px;border-bottom:1px solid var(--line);cursor:pointer}
.me small{color:var(--mute);display:block;font-size:12px}
h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:16px 16px 8px}
#list{flex:1;overflow:auto;padding:0 8px 8px}
.peer{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:10px;cursor:pointer}
.peer:hover,.peer.sel{background:var(--card)}.peer.sel{outline:1px solid var(--accent)}
.empty{color:var(--mute);font-size:13px;padding:12px 8px;line-height:1.5}
.av{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#0b0d12;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}.av.big{width:96px;height:96px;font-size:36px}
#status{padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
#status i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--err);margin-right:8px}
#status.on i{background:var(--ok)}
main{flex:1;display:flex;flex-direction:column;padding:24px;gap:16px;min-width:0}
#drop{flex:1;border:2px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--mute);text-align:center;transition:.15s;padding:20px}
#drop.over{border-color:var(--accent);background:rgba(108,140,255,.08);color:var(--text)}#drop.off{opacity:.5}
#drop h2{color:var(--text);font-size:20px;font-weight:600}
button{background:var(--accent);color:#0b0d12;border:0;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
button.ghost{background:var(--card);color:var(--text)}button:disabled{opacity:.4;cursor:default}
#log{max-height:190px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.row .top{display:flex;justify-content:space-between;gap:12px}.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .1s}
.done .bar i{background:var(--ok)}.error .bar i{background:var(--err);width:100%}
.row a{color:var(--accent);cursor:pointer}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:10}
#setup{background:var(--bg)}#ask{background:rgba(0,0,0,.6)}
.box{display:flex;flex-direction:column;align-items:center;gap:16px;width:320px;text-align:center}
#ask .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
#askFiles{color:var(--mute);font-size:13px;word-break:break-word;max-height:90px;overflow:auto}
.btns{display:flex;gap:10px}
input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);color:var(--text);padding:12px;border-radius:10px;font-size:15px;outline:none;text-align:center}
input[type=text]:focus{border-color:var(--accent)}.hidden{display:none!important}
</style>
</head>
<body>
<div id="setup" class="overlay hidden"><div class="box">
  <h2>Droply'ya hoş geldin</h2>
  <div id="setupAv" class="av big" title="Fotoğraf seç">?</div>
  <input id="nameInput" type="text" maxlength="24" placeholder="Kullanıcı adın">
  <button id="saveBtn">Başla</button>
  <input id="avFile" type="file" accept="image/*" class="hidden">
</div></div>

<div id="ask" class="overlay hidden"><div class="box">
  <h3 style="padding:0">Gelen dosya</h3>
  <b id="askTxt"></b><div id="askFiles"></div>
  <div class="btns"><button id="rejBtn" class="ghost">Reddet</button><button id="accBtn">Kabul et</button></div>
</div></div>

<aside>
  <div class="me" id="meBox" title="Profili düzenle"><div id="meAv" class="av">?</div><div><b id="meName"></b><small>Profili düzenle</small></div></div>
  <h3>Çevrimiçi kişiler</h3>
  <div id="list"></div>
  <div id="status"><i></i><span>Bağlanıyor…</span></div>
</aside>

<main>
  <div id="drop" class="off">
    <h2 id="dropTitle">Soldan bir kişi seç</h2>
    <div>Dosyaları buraya sürükle, <b>Ctrl+V</b> ile yapıştır<br>veya dosya seç</div>
    <button id="pickBtn" disabled>Dosya seç</button>
    <input id="fi" type="file" multiple class="hidden">
  </div>
  <div id="log"></div>
</main>

<script src="config.js"></script>
<script>
const $ = s => document.querySelector(s);
const { SERVER_URL, KEY, ICE } = window.CONFIG;
let me, ws, peers = [], sel = null, pendAv = null;
const sess = {}, asks = [];
const fmt = b => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : Math.ceil(b / 1e3) + ' KB';

/* ---------- UI ---------- */
function avatar(src, name, big) {
  const d = document.createElement('div'); d.className = 'av' + (big ? ' big' : '');
  d.textContent = (name || '?')[0].toUpperCase();
  if (src) { const i = new Image(); i.onload = () => { d.textContent = ''; d.appendChild(i); }; i.src = src; }
  return d;
}
function resizeImage(file) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = c.height = 128;
      const s = Math.min(img.width, img.height);
      c.getContext('2d').drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 128, 128);
      res(c.toDataURL('image/jpeg', .85));
    };
    img.src = URL.createObjectURL(file);
  });
}
function renderMe() { $('#meName').textContent = me.name; const n = avatar(me.avatar, me.name); n.id = 'meAv'; $('#meAv').replaceWith(n); }
function renderPeers() {
  const l = $('#list'); l.innerHTML = '';
  if (!peers.length) { l.innerHTML = '<div class="empty">Şu an kimse çevrimiçi değil. Arkadaşların Droply\'yı açtığında burada görünecek.</div>'; return; }
  peers.forEach(p => {
    const el = document.createElement('div'); el.className = 'peer' + (p.id === sel ? ' sel' : '');
    el.appendChild(avatar(p.av, p.name));
    const n = document.createElement('div'); n.textContent = p.name; el.appendChild(n);
    el.onclick = () => { sel = p.id; updateDrop(); renderPeers(); };
    l.appendChild(el);
  });
}
function updateDrop() {
  const p = peers.find(x => x.id === sel); if (!p) sel = null;
  $('#drop').classList.toggle('off', !p); $('#pickBtn').disabled = !p;
  $('#dropTitle').textContent = p ? `${p.name} kişisine gönder` : 'Soldan bir kişi seç';
}
function setStatus(on) { $('#status').classList.toggle('on', on); $('#status span').textContent = on ? 'Sunucuya bağlı' : 'Bağlanıyor…'; }
function row(id, d) {
  let r = document.getElementById(id);
  if (!r) { r = document.createElement('div'); r.id = id; r.innerHTML = '<div class="top"><span class="nm"></span><span class="st"></span></div><div class="bar"><i></i></div>'; $('#log').prepend(r); }
  r.className = 'row ' + (d.state || '');
  if (d.label) r.querySelector('.nm').textContent = d.label;
  const st = r.querySelector('.st');
  if (d.path) { st.textContent = ''; const a = document.createElement('a'); a.textContent = 'Klasörde göster'; a.onclick = () => api.showFile(d.path); st.append(a); }
  else st.textContent = d.msg || '';
  if (d.pct != null) r.querySelector('i').style.width = d.pct + '%';
}
const toast = msg => row('t' + Math.random(), { label: msg, state: 'error' });
const prog = (s, sent, total) => row(s.tid, { msg: Math.round(sent / total * 100) + '%', pct: sent / total * 100, state: 'sending' });

/* ---------- Sunucu bağlantısı ---------- */
const send = o => ws && ws.readyState === 1 && ws.send(JSON.stringify(o));
const hello = () => me.name && send({ t: 'hello', id: me.id, name: me.name, av: me.avatar });
const sig = (to, data) => send({ t: 'sig', to, data });
function connect() {
  ws = new WebSocket(`${SERVER_URL}/?key=${encodeURIComponent(KEY)}`);
  ws.onopen = () => { setStatus(true); hello(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.t === 'peers') { peers = m.peers.filter(p => p.id !== me.id).sort((a, b) => a.name.localeCompare(b.name)); renderPeers(); updateDrop(); }
    else if (m.t === 'sig') onSig(m.from, m.data);
  };
  ws.onclose = () => { setStatus(false); setTimeout(connect, 3000); };
}

/* ---------- Gönderen taraf ---------- */
async function sendFiles(files) {
  const peer = peers.find(p => p.id === sel);
  if (!peer) return toast('Önce bir kişi seç');
  if (!files.length) return;
  const tid = crypto.randomUUID();
  const s = sess[tid] = { tid, peerId: peer.id, files, dir: 'out', q: Promise.resolve(), sent: 0, total: files.reduce((a, f) => a + f.size, 0) || 1 };
  sig(peer.id, { t: 'req', tid, from: me.name, files: files.map(f => ({ name: f.name, size: f.size })) });
  row(tid, { label: `${files.length} dosya → ${peer.name}`, msg: 'Onay bekleniyor…', state: 'sending', pct: 0 });
  s.timer = setTimeout(() => !s.pc && fail(s, 'Yanıt gelmedi'), 60000);
}
async function startSender(s) {
  const pc = makePc(s), ch = pc.createDataChannel('f');
  ch.binaryType = 'arraybuffer'; ch.bufferedAmountLowThreshold = 256 * 1024;
  ch.onopen = () => pump(s, ch);
  ch.onmessage = e => { if (e.data === 'ok') { s.fin = true; row(s.tid, { msg: 'Gönderildi ✓', pct: 100, state: 'done' }); cleanup(s); } };
  ch.onclose = () => fail(s, 'Bağlantı koptu');
  await pc.setLocalDescription(await pc.createOffer());
  sig(s.peerId, { t: 'offer', tid: s.tid, sdp: pc.localDescription });
}
async function pump(s, ch) {
  const C = 65536;
  try {
    for (const f of s.files) {
      ch.send(JSON.stringify({ t: 'file', name: f.name, size: f.size }));
      for (let o = 0; o < f.size; o += C) {
        if (ch.bufferedAmount > (1 << 20)) await new Promise(r => (ch.onbufferedamountlow = r));
        ch.send(await f.slice(o, o + C).arrayBuffer());
        s.sent += Math.min(C, f.size - o); prog(s, s.sent, s.total);
      }
      ch.send(JSON.stringify({ t: 'eof' }));
    }
    ch.send(JSON.stringify({ t: 'done' }));
    row(s.tid, { msg: 'Tamamlanıyor…', pct: 100, state: 'sending' });
  } catch { fail(s, 'Dosya okunamadı'); }
}

/* ---------- Alıcı taraf ---------- */
function recv(s, ch) {
  ch.binaryType = 'arraybuffer';
  const total = s.files.reduce((a, f) => a + f.size, 0) || 1; let got = 0;
  ch.onmessage = e => {
    if (typeof e.data === 'string') {
      const m = JSON.parse(e.data);
      if (m.t === 'file') api.saveOpen(s.tid, m.name);
      else if (m.t === 'eof') api.saveClose(s.tid);
      else if (m.t === 'done') { s.fin = true; ch.send('ok'); row(s.tid, { msg: 'Alındı ✓', pct: 100, state: 'done' }); cleanup(s); }
    } else { api.saveChunk(s.tid, new Uint8Array(e.data)); got += e.data.byteLength; prog(s, got, total); }
  };
  ch.onclose = () => fail(s, 'Bağlantı koptu');
}
function askUser(from, d) {
  asks.push({ from, d });
  new Notification('Droply', { body: `${d.from} sana ${d.files.length} dosya göndermek istiyor` });
  if (asks.length === 1) showAsk();
}
function showAsk() {
  const a = asks[0]; if (!a) return $('#ask').classList.add('hidden');
  const size = a.d.files.reduce((t, f) => t + f.size, 0);
  $('#askTxt').textContent = `${a.d.from} sana ${a.d.files.length} dosya (${fmt(size)}) göndermek istiyor`;
  $('#askFiles').textContent = a.d.files.map(f => f.name).join(', ');
  $('#ask').classList.remove('hidden');
}
function answer(ok) {
  const { from, d } = asks.shift();
  if (ok) {
    sess[d.tid] = { tid: d.tid, peerId: from, dir: 'in', files: d.files, q: Promise.resolve() };
    row(d.tid, { label: `${d.files.length} dosya ← ${d.from}`, msg: 'Bağlanıyor…', state: 'sending', pct: 0 });
    sig(from, { t: 'acc', tid: d.tid });
  } else sig(from, { t: 'rej', tid: d.tid });
  showAsk();
}
$('#accBtn').onclick = () => answer(true);
$('#rejBtn').onclick = () => answer(false);

/* ---------- WebRTC ortak ---------- */
function makePc(s) {
  const pc = new RTCPeerConnection({ iceServers: ICE }); s.pc = pc;
  pc.onicecandidate = e => e.candidate && sig(s.peerId, { t: 'ice', tid: s.tid, c: e.candidate });
  pc.onconnectionstatechange = () => pc.connectionState === 'failed' && fail(s, 'Bağlantı kurulamadı (ağ engelliyor olabilir)');
  return pc;
}
async function flush(s) { for (const c of s.pend || []) await s.pc.addIceCandidate(c); s.pend = []; }
function onSig(from, d) {
  if (d.t === 'req') return askUser(from, d);
  const s = sess[d.tid]; if (!s || s.peerId !== from) return;
  s.q = s.q.then(() => handle(s, d)).catch(() => fail(s, 'Bağlantı hatası'));
}
async function handle(s, d) {
  if (d.t === 'rej') return fail(s, 'Reddedildi');
  if (d.t === 'acc') { clearTimeout(s.timer); row(s.tid, { msg: 'Bağlanıyor…', state: 'sending' }); return startSender(s); }
  if (d.t === 'offer') {
    const pc = makePc(s); pc.ondatachannel = e => recv(s, e.channel);
    await pc.setRemoteDescription(d.sdp); await flush(s);
    await pc.setLocalDescription(await pc.createAnswer());
    return sig(s.peerId, { t: 'answer', tid: s.tid, sdp: pc.localDescription });
  }
  if (d.t === 'answer') { await s.pc.setRemoteDescription(d.sdp); return flush(s); }
  if (d.t === 'ice') { if (s.pc && s.pc.remoteDescription) await s.pc.addIceCandidate(d.c); else (s.pend = s.pend || []).push(d.c); }
}
function cleanup(s) { clearTimeout(s.timer); setTimeout(() => s.pc && s.pc.close(), 1500); delete sess[s.tid]; }
function fail(s, msg) {
  if (s.fin) return; s.fin = true;
  row(s.tid, { msg, state: 'error' }); clearTimeout(s.timer); s.pc && s.pc.close(); delete sess[s.tid];
}

/* ---------- Girdi: sürükle-bırak, Ctrl+V, dosya seç ---------- */
const drop = $('#drop');
['dragenter', 'dragover'].forEach(e => document.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
document.addEventListener('dragleave', ev => { ev.preventDefault(); if (!ev.relatedTarget) drop.classList.remove('over'); });
document.addEventListener('drop', ev => {
  ev.preventDefault(); drop.classList.remove('over');
  const files = [...ev.dataTransfer.items].filter(i => i.kind === 'file' && i.webkitGetAsEntry && i.webkitGetAsEntry().isFile).map(i => i.getAsFile());
  sendFiles(files);
});
document.addEventListener('paste', ev => {
  if (ev.target.tagName === 'INPUT') return;
  const files = [...(ev.clipboardData.files || [])].map(f => f.name === 'image.png' ? new File([f], `pano-${Date.now()}.png`, { type: f.type }) : f);
  if (files.length) { ev.preventDefault(); sendFiles(files); }
});
$('#pickBtn').onclick = () => $('#fi').click();
$('#fi').onchange = e => { sendFiles([...e.target.files]); e.target.value = ''; };

/* ---------- Profil ---------- */
function setupAv(src) { const n = avatar(src, $('#nameInput').value || me.name, true); n.id = 'setupAv'; n.onclick = () => $('#avFile').click(); $('#setupAv').replaceWith(n); }
function openSetup(edit) { $('#setup').classList.remove('hidden'); $('#nameInput').value = edit ? me.name : ''; pendAv = null; setupAv(me.avatar); $('#nameInput').focus(); }
$('#setupAv').onclick = () => $('#avFile').click();
$('#avFile').onchange = async e => { if (e.target.files[0]) { pendAv = await resizeImage(e.target.files[0]); setupAv(pendAv); } };
$('#saveBtn').onclick = async () => {
  const name = $('#nameInput').value.trim(); if (!name) return $('#nameInput').focus();
  me = await api.saveProfile({ name, avatar: pendAv ?? me.avatar });
  $('#setup').classList.add('hidden'); renderMe(); hello();
};
$('#nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#saveBtn').click(); });
$('#meBox').onclick = () => openSetup(true);
api.on('saved', d => row('f' + Math.random(), { label: d.name, path: d.path, state: 'done', pct: 100 }));

window.addEventListener('focus', () => { if (!$('#setup').classList.contains('hidden')) $('#nameInput').focus(); });
$('#setup').addEventListener('mousedown', e => { if (e.target.id === 'nameInput') setTimeout(() => e.target.focus(), 0); });
(async () => {
  me = await api.getProfile();
  if (!me.name) openSetup(false); else renderMe();
  renderPeers(); connect();
})();
</script>
</body>
</html>
